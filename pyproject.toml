[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-recommender"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "torch",
    "transformers",
    "tqdm",
    "scipy",
    "scikit-learn",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["skill_recommender"]

[tool.pytest.ini_options]
testpaths = ["tests"]
