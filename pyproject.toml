[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-recommender"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "torch",
    "transformers",
    "tqdm",
    "scipy",
    "scikit-learn",
]

[project.optional-dependencies]
dev = ["pytest"]
clinical-trial = [
    "langgraph>=0.2.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "faiss-cpu>=1.8.0",
    "pypdf>=4.0.0",
    "pydantic>=2.0.0",
    "deepeval>=2.0.0",
    "accelerate>=0.25.0",
]

[tool.setuptools]
packages = ["skill_recommender", "clinical_trial_agent", "clinical_trial_agent.src", "clinical_trial_agent.eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
