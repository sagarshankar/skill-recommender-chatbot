name: Retriever Evaluation

on:
  workflow_dispatch:
    inputs:
      golden_path:
        description: "Path to golden dataset JSON"
        default: "clinical_trial_agent/eval/retriever_golden_synthetic.json"
        type: string
      langsmith:
        description: "Push results to LangSmith"
        default: false
        type: boolean
      experiment_prefix:
        description: "LangSmith experiment name prefix"
        default: "retriever-eval-ci"
        type: string

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[clinical-trial]"

      - name: Verify FAISS index exists
        run: |
          if [ ! -f clinical_trial_agent/data/faiss_index/index.faiss ]; then
            echo "::error::FAISS index not found. Run ingest.py locally and commit the index."
            exit 1
          fi

      - name: Run retriever evaluation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
        run: |
          ARGS="--golden-path ${{ inputs.golden_path }}"

          if [ "${{ inputs.langsmith }}" = "true" ]; then
            ARGS="$ARGS --langsmith --experiment-prefix ${{ inputs.experiment_prefix }}"
          fi

          python -m clinical_trial_agent.eval.eval_retriever $ARGS
